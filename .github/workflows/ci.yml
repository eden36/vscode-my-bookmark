name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # 只跑 check:unit：集成测试需要真实的 VS Code/Electron 环境，仍由本地执行。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:unit
